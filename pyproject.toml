[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "casecrash"
version = "0.1.0"
description = "Find filenames in your git index that would collide on macOS or Windows checkouts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "hao li"}]
keywords = ["git", "macos", "windows", "filename", "case-sensitivity", "unicode", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]

[project.scripts]
casecrash = "casecrash.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/casecrash"

[tool.setuptools.packages.find]
where = ["src"]
include = ["casecrash*"]
